[package]
name = "yo_dawg"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["src/synths/basic", "src/synths/tb303", "xtask"]
default-members = ["."]
resolver = "2"

[dependencies]
anyhow = "1"
cpal = "0.15"
crossbeam-channel = "0.5"
crossbeam-queue = "0.3"
crossterm = "0.29"
midir = "0.10"
midly = "0.5"
ratatui = "0.30.2"
ratatui-explorer = "0.3"
tui-slider = { version = "0.4.7", default-features = false }
rustysynth = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vst3-host = { version = "0.10", default-features = false }

[dev-dependencies]
tempfile = "3"
